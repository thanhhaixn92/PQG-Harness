name: dependency-lock-refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refresh lockfile without major upgrades
        run: |
          npm install --package-lock-only --ignore-scripts
          npm update fast-uri qs --package-lock-only --ignore-scripts
      - name: Record audit summary
        run: |
          npm audit --json > audit.json || true
          node -e "const r=require('./audit.json'); console.log(JSON.stringify(r.metadata?.vulnerabilities || {}))"
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix: refresh dependency lock security floors'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: issue-76-finalize

on:
  push:
    branches: [feature/76-application-shell]
    paths:
      - .github/workflows/issue-76-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/76-application-shell
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Consolidate Application Shell prepare pipeline
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('scripts/prepare-dsh-web.mjs')
          source = path.read_text()
          pattern = re.compile(r"async function preparePqgApplicationShellClient\(\) \{.*?\n\}\n\nasync function preparePqgMantineSpikeClient", re.S)
          replacement = r'''async function preparePqgApplicationShellClient() {
            const entry = join(root, 'packages', 'application-shell', 'src', 'client.tsx')
            const result = await build({
              configFile: false,
              root,
              logLevel: 'silent',
              define: {
                'process.env.NODE_ENV': JSON.stringify('production'),
              },
              build: {
                write: false,
                target: 'es2022',
                minify: 'esbuild',
                cssCodeSplit: false,
                lib: {
                  entry,
                  formats: ['cjs'],
                  fileName: 'client',
                },
                rollupOptions: {
                  external: id => reactPlatformExternals.has(id),
                  output: { inlineDynamicImports: true },
                },
              },
            })
            const runs = Array.isArray(result) ? result : [result]
            const outputs = runs.flatMap(run => Array.isArray(run?.output) ? run.output : [])
            const chunk = outputs.find(output => output.type === 'chunk' && output.isEntry)
            const css = outputs.find(output => output.type === 'asset' && output.fileName.endsWith('.css'))
            if (!chunk) throw new Error('PQG Application Shell bundle produced no entry chunk.')
            if (!css || typeof css.source !== 'string') throw new Error('PQG Application Shell bundle produced no CSS asset.')

            const bundled = [
              'window.__ModuleLoader__.load({ id: ' + JSON.stringify(pqgApplicationShellId) + ', factory: (require) => { var module = { exports: {} }; var exports = module.exports;',
              chunk.code.trimEnd(),
              'return module.exports; } });',
              '',
            ].join('\n')
            const targetDir = join(publicDir, 'plugins', ...pqgApplicationShellId.split('/'))
            await mkdir(targetDir, { recursive: true })
            await writeFile(join(targetDir, 'client.js'), bundled)
            await writeFile(join(targetDir, 'styles.css'), css.source)
            return {
              entry: {
                id: pqgApplicationShellId,
                url: `/plugins/${pqgApplicationShellId}/client.js?rev=${hash(bundled)}`,
                rev: hash(bundled),
                inject: [
                  '@deepseek-ai/dsh-client-runtime',
                  '@deepseek-ai/dsh-client-ui-slots',
                ],
              },
              cssUrl: `/plugins/${pqgApplicationShellId}/styles.css?rev=${hash(css.source)}`,
            }
          }

          async function preparePqgMantineSpikeClient'''
          source, count = pattern.subn(lambda _: replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'application shell prepare function drifted: {count}')

          old_entries = "  ...(await clientPackages()),\n  applicationShell,\n  referenceModule,"
          new_entries = "  ...(await clientPackages()),\n  applicationShell.entry,\n  referenceModule,"
          if source.count(old_entries) != 1:
              raise SystemExit('application shell graph entry shape drifted')
          source = source.replace(old_entries, new_entries, 1)

          old_html = 'const html = shellHtml.replace(headWithCharset, `${headWithCharset}\\n    <link rel="stylesheet" data-pqg-mantine-spike href="${mantineSpike.cssUrl}" />${makersBootstrap(graph)}`)'
          new_html = 'const html = shellHtml.replace(headWithCharset, `${headWithCharset}\\n    <link rel="stylesheet" data-pqg-mantine-spike href="${mantineSpike.cssUrl}" />\\n    <link rel="stylesheet" data-pqg-application-shell href="${applicationShell.cssUrl}" />${makersBootstrap(graph)}`)'
          if source.count(old_html) != 1:
              raise SystemExit('application shell CSS insertion point drifted')
          source = source.replace(old_html, new_html, 1)
          path.write_text(source)
          PY
          rm scripts/prepare-pqg-application-shell.mjs
          npm install --package-lock-only --ignore-scripts
          git diff --check
      - name: Install final dependencies
        run: npm ci
      - name: Prepare final DSH Web
        run: npm run prepare:dsh-web
      - name: Targeted Application Shell contract
        run: node --experimental-strip-types --test tests/application-shell-contract.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Minimal Chromium shell smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/issue-76-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true; kill "${CHROME_PID:-}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/issue-76-final-chrome about:blank >/tmp/issue-76-chrome.log 2>&1 &
          CHROME_PID=$!
          node <<'NODE'
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms))
          for (let i = 0; i < 100; i++) {
            try {
              const response = await fetch('http://127.0.0.1:9222/json/version')
              if (response.ok) break
            } catch {}
            if (i === 99) throw new Error('Chrome DevTools endpoint did not become ready')
            await delay(100)
          }
          const created = await fetch('http://127.0.0.1:9222/json/new?about:blank', { method: 'PUT' })
          if (!created.ok) throw new Error(`Failed to create browser target: HTTP ${created.status}`)
          const target = await created.json()
          const ws = new WebSocket(target.webSocketDebuggerUrl)
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true })
            ws.addEventListener('error', reject, { once: true })
          })
          let sequence = 0
          const pending = new Map()
          const errors = []
          let loadedResolve
          const loaded = new Promise(resolve => { loadedResolve = resolve })
          ws.addEventListener('message', event => {
            const message = JSON.parse(event.data)
            if (message.id && pending.has(message.id)) {
              const { resolve, reject } = pending.get(message.id)
              pending.delete(message.id)
              if (message.error) reject(new Error(JSON.stringify(message.error)))
              else resolve(message.result)
              return
            }
            if (message.method === 'Page.loadEventFired') loadedResolve()
            if (message.method === 'Runtime.exceptionThrown') errors.push(message.params?.exceptionDetails?.text ?? '')
            if (message.method === 'Runtime.consoleAPICalled' && message.params?.type === 'error') {
              errors.push((message.params.args ?? []).map(arg => arg.value ?? arg.description ?? '').join(' '))
            }
          })
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = ++sequence
            pending.set(id, { resolve, reject })
            ws.send(JSON.stringify({ id, method, params }))
          })
          await send('Runtime.enable')
          await send('Page.enable')
          await send('Page.navigate', { url: 'http://127.0.0.1:4173/' })
          await Promise.race([loaded, delay(15000).then(() => { throw new Error('Page load timed out') })])
          let state
          for (let i = 0; i < 100; i++) {
            const result = await send('Runtime.evaluate', {
              expression: `({
                shell: document.querySelector('#pqg-application-shell') !== null,
                active: document.querySelector('#pqg-application-shell')?.getAttribute('data-pqg-active'),
                support: document.querySelector('[data-pqg-support-toggle]') !== null,
                reference: document.querySelector('[data-pqg-reference-nav]') !== null
              })`,
              returnByValue: true,
            })
            state = result?.result?.value
            if (state?.shell && state?.support) break
            await delay(100)
          }
          const fatal = errors.filter(text => /root.*no registration|slot.*collision|layout: panel actions not wired|activation.*(?:fail|error)|web boot: .*did not activate/i.test(text))
          console.log(JSON.stringify({ state, fatal }, null, 2))
          ws.close()
          if (!state?.shell || state?.active !== 'home' || !state?.support) throw new Error('PQG shell smoke did not reach Home')
          if (state.reference) throw new Error('default-disabled reference module rendered in navigation')
          if (fatal.length) throw new Error(`Composition boot errors detected: ${fatal.join(' | ')}`)
          NODE
      - name: Exact Makers build
        run: npm run build:makers
      - name: Commit verified pipeline consolidation
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json scripts/prepare-dsh-web.mjs
          git add -u scripts/prepare-pqg-application-shell.mjs
          git diff --cached --exit-code >/dev/null && { echo 'No finalizer diff produced.' >&2; exit 1; } || true
          git commit -m 'fix: consolidate application shell prepare pipeline'
          git push origin HEAD:feature/76-application-shell

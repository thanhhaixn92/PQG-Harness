name: Task toggle targeted

on:
  push:
    branches:
      - fix/78-module-toggle-reload

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --experimental-strip-types --test tests/task-module.test.ts

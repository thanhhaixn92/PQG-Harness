name: foundation-picker-targeted

on:
  push:
    branches: [fix/48-foundation-recovery]

permissions:
  contents: write

jobs:
  targeted:
    if: "${{ github.event.head_commit.message == 'ci: run temporary picker target' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Remove native host picker from Makers composition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/prepare-dsh-web.mjs')
          source = path.read_text()
          old_comment = "  // The Makers deployment has no native desktop directory chooser. The\n  // native row is retained because the upstream Web composition selects it;\n  // the browse twin would double-occupy the same UI seat.\n"
          new_comment = "  // Makers provisions its conversation-scoped cloud workspace automatically.\n"
          picker = "  '@deepseek-ai/dsh-client-ui-directory-picker-browse',\n"
          pickers = picker + "  '@deepseek-ai/dsh-client-ui-directory-picker-native',\n"
          if source.count(old_comment) != 1:
              raise SystemExit('picker comment patch point not found exactly once')
          if source.count(picker) != 1:
              raise SystemExit('browse picker patch point not found exactly once')
          source = source.replace(old_comment, new_comment, 1)
          source = source.replace(picker, pickers, 1)
          path.write_text(source)
          PY
      - run: npm run prepare:dsh-web
      - run: node --experimental-strip-types --test tests/dsh-web.test.ts
      - name: Commit deterministic prepared output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/prepare-dsh-web.mjs index.html public agents/api
          git diff --cached --check
          git commit -m 'fix: remove native picker from Makers bootstrap'
          git push origin HEAD:fix/48-foundation-recovery

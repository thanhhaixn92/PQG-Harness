name: wp4-lock-refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'impl/wp4-supply-chain-core'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply reviewed lock edits only
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          const path = 'package-lock.json'
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'))
          const root = lock.packages?.['']?.dependencies
          assert.ok(root, 'root lock dependencies missing')
          for (const name of Object.keys(root)) {
            if (name === '@deepseek-ai/dsh' || name.startsWith('@deepseek-ai/dsh-')) root[name] = '0.1.0-rc.6'
          }
          root.ws = '8.21.3'
          const ws = lock.packages?.['node_modules/ws']
          assert.ok(ws, 'ws lock entry missing')
          ws.version = '8.21.3'
          ws.resolved = 'https://registry.npmjs.org/ws/-/ws-8.21.3.tgz'
          ws.integrity = 'sha512-201TZ/kPWxoPr/OKWjquZR1SWKXcvxdH+e1xrx89b3YbmzLMFCLfnaG1HFIgWzJOEWZ7MvpK++odZufgYR50Rw=='
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`)
          NODE

      - name: Validate lock with npm ci
        run: npm ci --ignore-scripts

      - name: Commit refreshed lock if needed
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(wp4): refresh reviewed lockfile'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

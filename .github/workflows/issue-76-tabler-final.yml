name: issue-76-tabler-final

on:
  push:
    branches: [feature/76-application-shell]
    paths:
      - .github/workflows/issue-76-tabler-final.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/76-application-shell
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Add approved Tabler reuse
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          package = Path('package.json')
          source = package.read_text()
          old = '    "@pqg/reference-module": "file:packages/reference-module",\n    "ws": "8.21.3",'
          new = '    "@pqg/reference-module": "file:packages/reference-module",\n    "@tabler/icons-react": "3.46.0",\n    "ws": "8.21.3",'
          if source.count(old) != 1:
              raise SystemExit('root package dependency insertion point drifted')
          package.write_text(source.replace(old, new, 1))

          client = Path('packages/application-shell/src/client.tsx')
          source = client.read_text()
          old = "} from '@mantine/core'\n// @ts-expect-error Vite bundles Mantine's exported CSS file; it has no TypeScript declaration."
          new = "} from '@mantine/core'\nimport { IconCheck, IconHome } from '@tabler/icons-react'\n// @ts-expect-error Vite bundles Mantine's exported CSS file; it has no TypeScript declaration."
          if source.count(old) != 1:
              raise SystemExit('Tabler import insertion point drifted')
          source = source.replace(old, new, 1)

          old_home = "React.createElement(NavLink, { label: pqgCopy.home, active: activeId === 'home', onClick: () => navigate('home') })"
          new_home = "React.createElement(NavLink, { label: pqgCopy.home, leftSection: React.createElement(IconHome, { size: 18, stroke: 1.8, 'aria-hidden': true }), active: activeId === 'home', onClick: () => navigate('home') })"
          if source.count(old_home) != 1:
              raise SystemExit('Home navigation insertion point drifted')
          source = source.replace(old_home, new_home, 1)

          old_approval = "React.createElement(NavLink, { label: pqgCopy.approval, active: activeId === 'approval', onClick: () => navigate('approval') })"
          new_approval = "React.createElement(NavLink, { label: pqgCopy.approval, leftSection: React.createElement(IconCheck, { size: 18, stroke: 1.8, 'aria-hidden': true }), active: activeId === 'approval', onClick: () => navigate('approval') })"
          if source.count(old_approval) != 1:
              raise SystemExit('Approval navigation insertion point drifted')
          client.write_text(source.replace(old_approval, new_approval, 1))
          PY
          npm install --package-lock-only --ignore-scripts
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Prepare DSH Web
        run: npm run prepare:dsh-web
      - name: Targeted Application Shell contract
        run: node --experimental-strip-types --test tests/application-shell-contract.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Minimal Chromium shell smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/issue-76-tabler-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true; kill "${CHROME_PID:-}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/issue-76-tabler-chrome about:blank >/tmp/issue-76-tabler-chrome.log 2>&1 &
          CHROME_PID=$!
          node <<'NODE'
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms))
          for (let i = 0; i < 100; i++) {
            try {
              const response = await fetch('http://127.0.0.1:9222/json/version')
              if (response.ok) break
            } catch {}
            if (i === 99) throw new Error('Chrome DevTools endpoint did not become ready')
            await delay(100)
          }
          const created = await fetch('http://127.0.0.1:9222/json/new?about:blank', { method: 'PUT' })
          if (!created.ok) throw new Error(`Failed to create browser target: HTTP ${created.status}`)
          const target = await created.json()
          const ws = new WebSocket(target.webSocketDebuggerUrl)
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true })
            ws.addEventListener('error', reject, { once: true })
          })
          let sequence = 0
          const pending = new Map()
          const errors = []
          let loadedResolve
          const loaded = new Promise(resolve => { loadedResolve = resolve })
          ws.addEventListener('message', event => {
            const message = JSON.parse(event.data)
            if (message.id && pending.has(message.id)) {
              const { resolve, reject } = pending.get(message.id)
              pending.delete(message.id)
              if (message.error) reject(new Error(JSON.stringify(message.error)))
              else resolve(message.result)
              return
            }
            if (message.method === 'Page.loadEventFired') loadedResolve()
            if (message.method === 'Runtime.exceptionThrown') errors.push(message.params?.exceptionDetails?.text ?? '')
            if (message.method === 'Runtime.consoleAPICalled' && message.params?.type === 'error') {
              errors.push((message.params.args ?? []).map(arg => arg.value ?? arg.description ?? '').join(' '))
            }
          })
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = ++sequence
            pending.set(id, { resolve, reject })
            ws.send(JSON.stringify({ id, method, params }))
          })
          await send('Runtime.enable')
          await send('Page.enable')
          await send('Page.navigate', { url: 'http://127.0.0.1:4173/' })
          await Promise.race([loaded, delay(15000).then(() => { throw new Error('Page load timed out') })])
          let state
          for (let i = 0; i < 100; i++) {
            const result = await send('Runtime.evaluate', {
              expression: `(() => {
                const shell = document.querySelector('#pqg-application-shell')
                return {
                  shell: shell !== null,
                  active: shell?.getAttribute('data-pqg-active'),
                  support: shell?.querySelector('[data-pqg-support-toggle]') !== null,
                  reference: shell?.querySelector('[data-pqg-reference-nav]') !== null,
                  icons: shell?.querySelectorAll('nav svg').length ?? 0,
                  primaryText: shell?.innerText ?? ''
                }
              })()`,
              returnByValue: true,
            })
            state = result?.result?.value
            if (state?.shell && state?.support) break
            await delay(100)
          }
          const fatal = errors.filter(text => /root.*no registration|slot.*collision|layout: panel actions not wired|activation.*(?:fail|error)|web boot: .*did not activate/i.test(text))
          console.log(JSON.stringify({ state, fatal }, null, 2))
          ws.close()
          if (!state?.shell || state?.active !== 'home' || !state?.support) throw new Error('PQG shell smoke did not reach Home')
          if (state.reference) throw new Error('default-disabled reference module rendered in navigation')
          if (state.icons < 2) throw new Error('Tabler navigation icons did not render')
          if (/DeepSeek|EdgeOne/i.test(state.primaryText)) throw new Error('technical product identity leaked into primary PQG shell')
          if (fatal.length) throw new Error(`Composition boot errors detected: ${fatal.join(' | ')}`)
          NODE
      - name: Exact Makers build
        run: npm run build:makers
      - name: Commit verified Tabler reuse
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json packages/application-shell/src/client.tsx
          git diff --cached --quiet && { echo 'No Tabler diff produced.' >&2; exit 1; }
          git commit -m 'feat: use Tabler icons in PQG shell navigation'
          git push origin HEAD:feature/76-application-shell

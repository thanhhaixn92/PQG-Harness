name: issue-76-proof

on:
  push:
    branches: [feature/76-application-shell]

permissions:
  contents: read

concurrency:
  group: issue-76-proof
  cancel-in-progress: true

jobs:
  proof:
    if: contains(github.event.head_commit.message, '[issue-76-gate]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Prepare browser artifacts
        run: npm run prepare:dsh-web
      - name: Diagnose mobile navigation
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/issue-76-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true; kill "${CHROME_PID:-}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1 && break
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/issue-76-chrome about:blank >/tmp/issue-76-chrome.log 2>&1 &
          CHROME_PID=$!
          for _ in $(seq 1 300); do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break
            sleep 0.1
          done

          node <<'NODE'
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms))
          const created = await fetch('http://127.0.0.1:9222/json/new?about:blank', { method: 'PUT' })
          const target = await created.json()
          const ws = new WebSocket(target.webSocketDebuggerUrl)
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true })
            ws.addEventListener('error', reject, { once: true })
          })
          let sequence = 0
          const pending = new Map()
          ws.addEventListener('message', event => {
            const message = JSON.parse(event.data)
            if (!message.id || !pending.has(message.id)) return
            const { resolve, reject } = pending.get(message.id)
            pending.delete(message.id)
            if (message.error) reject(new Error(JSON.stringify(message.error)))
            else resolve(message.result)
          })
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = ++sequence
            pending.set(id, { resolve, reject })
            ws.send(JSON.stringify({ id, method, params }))
          })
          const evaluateRaw = expression => send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true })
          const evaluate = async expression => {
            const result = await evaluateRaw(expression)
            if (result?.exceptionDetails) {
              throw new Error(result.exceptionDetails.exception?.description ?? result.exceptionDetails.text)
            }
            return result?.result?.value
          }
          await send('Runtime.enable')
          await send('Page.enable')
          await send('Emulation.setDeviceMetricsOverride', { width: 390, height: 844, deviceScaleFactor: 1, mobile: true })
          await send('Page.navigate', { url: 'http://127.0.0.1:4173/' })
          for (let i = 0; i < 150; i++) {
            if (await evaluate('document.querySelector("#pqg-application-shell") !== null')) break
            if (i === 149) throw new Error('PQG shell did not mount')
            await delay(100)
          }
          const snapshot = await evaluate(`(() => ({
            innerWidth: window.innerWidth,
            root: !!document.querySelector('#pqg-application-shell'),
            burger: document.querySelector('button[aria-label="Mở điều hướng"]')?.outerHTML ?? null,
            buttons: Array.from(document.querySelectorAll('button')).map(button => ({
              label: button.getAttribute('aria-label'),
              text: button.textContent?.trim(),
              display: getComputedStyle(button).display,
            })).slice(0, 20),
          }))()`)
          console.log(JSON.stringify(snapshot, null, 2))
          const raw = await evaluateRaw(`(() => {
            const burger = document.querySelector('button[aria-label="Mở điều hướng"]')
            if (!burger) throw new Error('burger-not-found')
            burger.click()
            return true
          })()`)
          if (raw?.exceptionDetails) {
            console.error(JSON.stringify(raw.exceptionDetails, null, 2))
            throw new Error(raw.exceptionDetails.exception?.description ?? raw.exceptionDetails.text)
          }
          await delay(250)
          console.log(JSON.stringify({ navVisible: await evaluate('document.querySelector("[data-pqg-reference-nav]")?.getBoundingClientRect().width > 0') }, null, 2))
          ws.close()
          NODE

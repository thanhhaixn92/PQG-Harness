name: issue-76-proof

on:
  push:
    branches: [feature/76-application-shell]

permissions:
  contents: read

concurrency:
  group: issue-76-proof
  cancel-in-progress: true

jobs:
  proof:
    if: contains(github.event.head_commit.message, '[issue-76-gate]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Chrome startup
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          echo "CHROME=$CHROME"
          test -n "$CHROME"
          "$CHROME" --version || true
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/issue-76-chrome about:blank > /tmp/issue-76-chrome.log 2>&1 &
          CHROME_PID=$!
          echo "CHROME_PID=$CHROME_PID"
          ready=0
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:9222/json/version >/tmp/issue-76-cdp.json 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$CHROME_PID" 2>/dev/null; then break; fi
            sleep 0.1
          done
          echo '--- chrome log ---'
          cat /tmp/issue-76-chrome.log || true
          echo '--- process ---'
          ps -fp "$CHROME_PID" || true
          echo '--- cdp ---'
          cat /tmp/issue-76-cdp.json || true
          kill "$CHROME_PID" 2>/dev/null || true
          test "$ready" = 1

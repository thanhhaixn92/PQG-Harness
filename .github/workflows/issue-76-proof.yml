name: issue-76-proof

on:
  push:
    branches: [feature/76-application-shell]

permissions:
  contents: write

concurrency:
  group: issue-76-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/76-application-shell
      - name: Apply exact web root boot compatibility patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('scripts/prepare-dsh-web.mjs')
          source = path.read_text()

          if 'async function patchWebShellForPqgRoot()' not in source:
              anchor = "async function preparePqgModuleSettingsClient() {"
              if source.count(anchor) != 1:
                  raise SystemExit(f'web shell patch insertion: expected 1 anchor, found {source.count(anchor)}')

              patch = r'''async function patchWebShellForPqgRoot() {
            const indexHtml = await readFile(join(publicDir, 'index.html'), 'utf8')
            const assetMatch = indexHtml.match(/<script[^>]+src="\/assets\/([^\"]+\.js)"/)
            if (!assetMatch) {
              throw new Error('Published DSH Web index no longer exposes the expected module asset.')
            }
            const target = join(publicDir, 'assets', assetMatch[1])
            let source = await readFile(target, 'utf8')
            const appShellInject = 'const Fl="@deepseek-ai/dsh-client-app-shell",w8="app-shell",x8=["slots","sessions","layout"];function _8(n){'
            if (!source.includes(appShellInject)) {
              throw new Error('Published DSH Web shell no longer matches the PQG app-shell layout guard patch point.')
            }
            source = source.replace(
              appShellInject,
              'const Fl="@deepseek-ai/dsh-client-app-shell",w8="app-shell",x8=["slots","sessions"];function _8(n){',
            )
            const bootSweep = 'for(const s of r.loader.entries()){const u=s.options.name;if(s.fiber===void 0){'
            if (!source.includes(bootSweep)) {
              throw new Error('Published DSH Web shell no longer matches the PQG parked presentation boot patch point.')
            }
            source = source.replace(
              bootSweep,
              'for(const s of r.loader.entries()){const u=s.options.name;if((u==="@deepseek-ai/dsh-client-ui-sidebar"||u==="@deepseek-ai/dsh-client-ui-conversation")&&s.fiber!==void 0&&u3[s.fiber.state]==="pending"){const p=Object.keys(s.fiber.inject).filter(h=>r.get(h)===void 0);if(p.length===1&&p[0]==="layout")continue}if(s.fiber===void 0){',
            )
            await writeFile(target, source)
          }

          '''
              source = source.replace(anchor, patch + anchor, 1)

              call_anchor = "await cp(webDist, publicDir, { recursive: true })\nconst referenceModule = await preparePqgReferenceModuleClient()"
              if source.count(call_anchor) != 1:
                  raise SystemExit(f'web shell patch call: expected 1 anchor, found {source.count(call_anchor)}')
              source = source.replace(
                  call_anchor,
                  "await cp(webDist, publicDir, { recursive: true })\nawait patchWebShellForPqgRoot()\nconst referenceModule = await preparePqgReferenceModuleClient()",
                  1,
              )
              path.write_text(source)
          PY
          git diff --check
          git diff -- scripts/prepare-dsh-web.mjs
          if ! git diff --quiet -- scripts/prepare-dsh-web.mjs; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add scripts/prepare-dsh-web.mjs
            git commit -m 'fix: preserve parked DSH presentation plugins under PQG root'
            git push origin HEAD:feature/76-application-shell
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Prepare DSH Web proof bundles
        run: npm run prepare:dsh-web
      - name: Lifecycle composition proof
        run: node --experimental-strip-types --test tests/application-shell-contract.test.ts
      - name: Browser boot proof
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/issue-76-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true; kill "${CHROME_PID:-}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/issue-76-chrome about:blank > /tmp/issue-76-chrome.log 2>&1 &
          CHROME_PID=$!

          node <<'NODE'
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms))
          for (let i = 0; i < 100; i++) {
            try {
              const response = await fetch('http://127.0.0.1:9222/json/version')
              if (response.ok) break
            } catch {}
            if (i === 99) throw new Error('Chrome DevTools endpoint did not become ready')
            await delay(100)
          }

          const created = await fetch('http://127.0.0.1:9222/json/new?about:blank', { method: 'PUT' })
          if (!created.ok) throw new Error(`Failed to create browser target: HTTP ${created.status}`)
          const target = await created.json()
          const ws = new WebSocket(target.webSocketDebuggerUrl)
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true })
            ws.addEventListener('error', reject, { once: true })
          })

          let sequence = 0
          const pending = new Map()
          const observedErrors = []
          let loadedResolve
          const loaded = new Promise(resolve => { loadedResolve = resolve })

          ws.addEventListener('message', event => {
            const message = JSON.parse(event.data)
            if (message.id && pending.has(message.id)) {
              const { resolve, reject } = pending.get(message.id)
              pending.delete(message.id)
              if (message.error) reject(new Error(JSON.stringify(message.error)))
              else resolve(message.result)
              return
            }
            if (message.method === 'Page.loadEventFired') loadedResolve()
            if (message.method === 'Runtime.exceptionThrown') observedErrors.push(message.params?.exceptionDetails?.text ?? JSON.stringify(message.params))
            if (message.method === 'Log.entryAdded' && message.params?.entry?.level === 'error') observedErrors.push(message.params.entry.text)
            if (message.method === 'Runtime.consoleAPICalled' && message.params?.type === 'error') observedErrors.push((message.params.args ?? []).map(arg => arg.value ?? arg.description ?? '').join(' '))
          })

          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = ++sequence
            pending.set(id, { resolve, reject })
            ws.send(JSON.stringify({ id, method, params }))
          })

          await send('Runtime.enable')
          await send('Log.enable')
          await send('Page.enable')
          await send('Page.navigate', { url: 'http://127.0.0.1:4173/' })
          await Promise.race([loaded, delay(15000).then(() => { throw new Error('Page load timed out') })])

          let proofRendered = false
          for (let i = 0; i < 100; i++) {
            const result = await send('Runtime.evaluate', {
              expression: 'document.body?.innerText.includes("PQG shell proof contribution") === true',
              returnByValue: true,
            })
            if (result?.result?.value === true) {
              proofRendered = true
              break
            }
            await delay(100)
          }

          const fatal = observedErrors.filter(text => /root.*no registration|no registration.*root|slot.*collision|collision.*slot|layout: panel actions not wired|activation.*(?:fail|error)|activate.*(?:fail|error)|web boot: .*did not activate/i.test(text))
          console.log(JSON.stringify({ proofRendered, fatal, observedErrors }, null, 2))
          ws.close()
          if (!proofRendered) throw new Error('PQG proof contribution did not render in the browser')
          if (fatal.length > 0) throw new Error(`Composition boot errors detected: ${fatal.join(' | ')}`)
          NODE

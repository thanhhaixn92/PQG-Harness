name: issue-76-proof

on:
  push:
    branches: [feature/76-application-shell]

permissions:
  contents: read

concurrency:
  group: issue-76-proof
  cancel-in-progress: true

jobs:
  proof:
    if: contains(github.event.head_commit.message, '[issue-76-gate]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Prepare DSH Web bundles
        run: npm run prepare:dsh-web
      - name: Application Shell contract gate
        run: node --experimental-strip-types --test tests/application-shell-contract.test.ts

name: issue-76-review-unblock

on:
  push:
    branches: [feature/76-application-shell]

permissions:
  contents: write

jobs:
  unblock:
    if: ${{ contains(github.event.head_commit.message, 'unblock temporary issue 76 review runner') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/76-application-shell
      - name: Correct temporary runner expression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/issue-76-review-fix.yml')
          source = path.read_text()
          old = "    if: ${{ !contains(github.event.head_commit.message, '[issue-76-review-fix]') }}"
          new = "    if: ${{ ! contains(github.event.head_commit.message, '[issue-76-review-fix]') }}"
          if source.count(old) != 1:
              raise SystemExit('temporary runner expression drifted')
          path.write_text(source.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/issue-76-review-fix.yml
          git commit -m 'chore: correct temporary issue 76 runner expression'
          git push origin HEAD:feature/76-application-shell

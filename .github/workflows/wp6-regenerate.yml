name: wp6-regenerate

on:
  push:
    branches:
      - impl/wp6-product-locale-a11y

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:dsh-web
      - name: Commit deterministic generated artifacts
        run: |
          if git diff --quiet -- index.html public agents/api; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public agents/api
          git commit -m "chore(wp6): regenerate productized DSH web"
          git push origin HEAD:impl/wp6-product-locale-a11y

name: tmp-shell-theme-tdd
on:
  push:
    branches:
      - fix/application-shell-theme-layout
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/application-shell-contract.test.ts

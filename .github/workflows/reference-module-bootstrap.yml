name: reference-module-bootstrap

on:
  push:
    branches: [feat/reference-module-phase-a]
    paths: [.github/workflows/reference-module-bootstrap.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reference-module-phase-a
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Restore minimal lockfile delta
        run: |
          git show origin/main:package-lock.json > package-lock.json
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          const dependencies = lock.packages[''].dependencies
          const nextDependencies = {}
          for (const [name, value] of Object.entries(dependencies)) {
            if (name === 'ws') nextDependencies['@pqg/reference-module'] = 'file:packages/reference-module'
            nextDependencies[name] = value
          }
          lock.packages[''].dependencies = nextDependencies

          const nextPackages = {}
          let linked = false
          for (const [name, value] of Object.entries(lock.packages)) {
            if (name === 'node_modules/@protobufjs/aspromise') {
              nextPackages['node_modules/@pqg/reference-module'] = {
                resolved: 'packages/reference-module',
                link: true,
              }
              linked = true
            }
            nextPackages[name] = value
          }
          if (!linked) throw new Error('missing @protobufjs insertion seam')
          nextPackages['packages/reference-module'] = {
            name: '@pqg/reference-module',
            version: '0.0.0',
          }
          lock.packages = nextPackages
          writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`)
          NODE

      - name: Verify clean install and quality
        run: |
          npm ci
          npm run prepare:dsh-web
          git diff --exit-code -- index.html public agents/api
          npm run typecheck
          npm run test:prepared
          npm run build:prepared

      - name: Commit normalized lock and remove bootstrap workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/reference-module-bootstrap.yml
          git add package-lock.json
          git commit -m "chore: keep reference module lockfile delta minimal"
          git push origin HEAD:feat/reference-module-phase-a

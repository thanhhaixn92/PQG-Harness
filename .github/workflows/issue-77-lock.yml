name: issue-77-lock

on:
  push:
    branches:
      - feature/77-system-services
    paths:
      - .github/workflows/issue-77-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve exact Mantine lock entries
        run: |
          mkdir -p /tmp/issue-77-lock
          cat > /tmp/issue-77-lock/package.json <<'JSON'
          {
            "private": true,
            "dependencies": {
              "@mantine/notifications": "8.3.18",
              "@mantine/spotlight": "8.3.18"
            }
          }
          JSON
          npm install --prefix /tmp/issue-77-lock --package-lock-only --ignore-scripts
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const targetPath = 'package-lock.json'
          const target = JSON.parse(await readFile(targetPath, 'utf8'))
          const source = JSON.parse(await readFile('/tmp/issue-77-lock/package-lock.json', 'utf8'))
          target.packages[''].dependencies['@mantine/notifications'] = '8.3.18'
          target.packages[''].dependencies['@mantine/spotlight'] = '8.3.18'
          target.packages[''].dependencies = Object.fromEntries(Object.entries(target.packages[''].dependencies).sort(([a], [b]) => a.localeCompare(b)))
          const required = [
            'node_modules/@mantine/notifications',
            'node_modules/@mantine/spotlight',
            'node_modules/@mantine/store',
            'node_modules/react-transition-group',
            'node_modules/dom-helpers',
            'node_modules/prop-types',
            'node_modules/csstype',
            'node_modules/react-is',
          ]
          for (const key of required) {
            const entry = source.packages[key]
            if (entry === undefined) throw new Error(`temporary lock is missing ${key}`)
            target.packages[key] = entry
          }
          const root = target.packages['']
          target.packages = { '': root, ...Object.fromEntries(Object.entries(target.packages).filter(([key]) => key !== '').sort(([a], [b]) => a.localeCompare(b))) }
          await writeFile(targetPath, `${JSON.stringify(target, null, 2)}\n`)
          NODE
      - name: Assert lock-only mutation
        run: |
          unexpected="$(git diff --name-only | grep -v '^package-lock.json$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json was not updated'
            exit 1
          fi
      - name: Commit generated lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'deps: lock Mantine system service packages'
          git push origin HEAD:feature/77-system-services

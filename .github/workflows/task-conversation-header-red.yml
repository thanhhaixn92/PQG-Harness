name: task-conversation-header-red

on:
  push:
    branches:
      - fix/task-conversation-header

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --experimental-strip-types --test tests/task-module.test.ts

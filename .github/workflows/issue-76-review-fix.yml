name: issue-76-review-fix

on:
  push:
    branches: [feature/76-application-shell]

permissions:
  contents: write

concurrency:
  group: issue-76-review-fix
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[issue-76-review-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/76-application-shell
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install baseline dependencies
        run: npm ci
      - name: RED — tighten application shell contract test
        shell: bash
        run: |
          cat > tests/application-shell-contract.test.ts <<'EOF'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          import { createRequire } from 'node:module'
          import test from 'node:test'
          import vm from 'node:vm'

          import * as cordisModule from '@deepseek-ai/cordis'
          import { Context } from '@deepseek-ai/cordis'
          import * as slotCoreModule from '@deepseek-ai/dsh-client-ui-slots'

          const require = createRequire(import.meta.url)
          const runtimeBundleUrl = new URL('../public/plugins/@deepseek-ai/dsh-client-runtime/client.js', import.meta.url)
          const shellBundleUrl = new URL('../public/plugins/@pqg/application-shell/client.js', import.meta.url)
          const referenceBundleUrl = new URL('../public/plugins/@pqg/reference-module/client.js', import.meta.url)
          const layoutBundleUrl = new URL('../public/plugins/@deepseek-ai/dsh-client-ui-layout/client.js', import.meta.url)
          const visualSeats = [
            'pqg.shell.navigation',
            'pqg.shell.workspace',
            'pqg.shell.home.widget',
            'pqg.shell.support.context',
            'pqg.shell.support.suggestion',
          ] as const

          interface PluginModule {
            inject: string[]
            apply(ctx: Context): void | Promise<void>
          }

          interface SlotEntry {
            component: (props: any) => unknown
            select?: (owner: { activeId: string }) => unknown
          }

          interface SlotRegistryFace {
            entries(key: string): readonly SlotEntry[]
            spec(key: string): { kind: string; scope: string } | undefined
          }

          async function loadHandoff(
            url: URL,
            expectedId: string,
            globals: Record<string, unknown> = {},
          ) {
            const source = await readFile(url, 'utf8')
            const handoffs: Array<{ id: string; factory: (requireModule: (id: string) => unknown) => any }> = []
            vm.runInNewContext(source, {
              queueMicrotask,
              ...globals,
              window: {
                __ModuleLoader__: {
                  load(handoff: { id: string; factory: (requireModule: (id: string) => unknown) => any }) {
                    handoffs.push(handoff)
                  },
                },
              },
            }, { filename: url.pathname.split('/').at(-1) })
            assert.equal(handoffs.length, 1)
            assert.equal(handoffs[0]?.id, expectedId)
            return handoffs[0]!
          }

          async function loadPlugin(
            url: URL,
            expectedId: string,
            globals: Record<string, unknown> = {},
          ): Promise<PluginModule> {
            const handoff = await loadHandoff(url, expectedId, globals)
            return handoff.factory((id: string) => {
              if (id === 'react' || id === 'react/jsx-runtime' || id === 'react-dom' || id === 'react-dom/client') return require(id)
              throw new Error(`unexpected external module in ${expectedId}: ${id}`)
            }) as PluginModule
          }

          async function loadRuntimeSlotRegistry(): Promise<any> {
            const handoff = await loadHandoff(runtimeBundleUrl, '@deepseek-ai/dsh-client-runtime')
            const runtime = handoff.factory((id: string) => {
              if (id === '@deepseek-ai/cordis') return cordisModule
              if (id === '@deepseek-ai/dsh-client-ui-slots') return slotCoreModule
              throw new Error(`unexpected external module in DSH runtime: ${id}`)
            }) as { SlotRegistry?: unknown }
            assert.equal(typeof runtime.SlotRegistry, 'function')
            return runtime.SlotRegistry
          }

          test('Makers layout compatibility patch removes the shipped root owner as one unit but keeps ThemePresenter', async () => {
            const source = await readFile(layoutBundleUrl, 'utf8')
            assert.doesNotMatch(source, /ctx\.reflect\.provide\("layout", layout\)/)
            assert.doesNotMatch(source, /ui-layout: service \+ root registration/)
            assert.match(source, /ui-layout: theme presenter/)
            assert.match(source, /new ThemePresenter\(\)/)
          })

          test('PQG shell keeps search non-visual and gates module contributions by enabled policy', async () => {
            const SlotRegistry = await loadRuntimeSlotRegistry()
            const shell = await loadPlugin(shellBundleUrl, '@pqg/application-shell')
            let referenceEnabled = false
            const reference = await loadPlugin(referenceBundleUrl, '@pqg/reference-module', {
              fetch: async () => ({
                ok: true,
                json: async () => ({
                  modules: [{ id: 'reference', label: 'Reference Module', enabled: referenceEnabled }],
                }),
              }),
            })

            const ctx = new Context()
            await ctx.plugin(SlotRegistry).await()
            const slots = ctx.get('slots') as unknown as SlotRegistryFace

            const disabledReference = ctx.plugin({ inject: [...reference.inject], apply: reference.apply })
            await disabledReference.await()
            let shellFiber = ctx.plugin({ inject: [...shell.inject], apply: shell.apply })
            await shellFiber.await()
            assert.equal(slots.entries('root').length, 1, 'PQG must remain the only root registration')
            assert.equal(slots.spec('pqg.shell.search.provider'), undefined, 'search provider must not be a rendered slot')
            for (const seat of visualSeats) {
              assert.equal(slots.entries(seat).length, 0, `${seat} must stay empty while module is disabled`)
            }

            await disabledReference.dispose()
            await shellFiber.dispose()
            referenceEnabled = true

            let referenceFiber = ctx.plugin({ inject: [...reference.inject], apply: reference.apply })
            await referenceFiber.await()
            for (const seat of visualSeats) assert.equal(slots.entries(seat).length, 0, `${seat} must wait for shell declaration`)

            shellFiber = ctx.plugin({ inject: [...shell.inject], apply: shell.apply })
            await shellFiber.await()
            const expectedKinds: Record<(typeof visualSeats)[number], string> = {
              'pqg.shell.navigation': 'list',
              'pqg.shell.workspace': 'chain',
              'pqg.shell.home.widget': 'list',
              'pqg.shell.support.context': 'list',
              'pqg.shell.support.suggestion': 'list',
            }
            for (const seat of visualSeats) {
              assert.equal(slots.spec(seat)?.kind, expectedKinds[seat], `${seat} kind`)
              assert.equal(slots.spec(seat)?.scope, 'root', `${seat} scope`)
              assert.equal(slots.entries(seat).length, 1, `${seat} enabled reference contribution`)
            }

            const workspace = slots.entries('pqg.shell.workspace')[0]
            assert.equal(typeof workspace?.select, 'function')
            assert.equal((workspace?.select?.({ activeId: 'reference' }) as { moduleId?: string } | null)?.moduleId, 'reference')
            assert.equal(workspace?.select?.({ activeId: 'home' }), null)

            await referenceFiber.dispose()
            for (const seat of visualSeats) assert.equal(slots.entries(seat).length, 0, `${seat} must disappear when module disposes`)

            referenceFiber = ctx.plugin({ inject: [...reference.inject], apply: reference.apply })
            await referenceFiber.await()
            for (const seat of visualSeats) assert.equal(slots.entries(seat).length, 1, `${seat} must remount`)

            await shellFiber.dispose()
            for (const seat of visualSeats) assert.equal(slots.entries(seat).length, 0, `${seat} must collapse with shell owner`)

            shellFiber = ctx.plugin({ inject: [...shell.inject], apply: shell.apply })
            await shellFiber.await()
            for (const seat of visualSeats) assert.equal(slots.entries(seat).length, 1, `${seat} injection must recover after shell remount`)

            await referenceFiber.dispose()
            await shellFiber.dispose()
          })
          EOF
          npm run prepare:dsh-web
          set +e
          node --experimental-strip-types --test tests/application-shell-contract.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected RED contract test to fail against pre-fix production code.' >&2
            exit 1
          fi
          echo "RED confirmed with expected contract mismatch (exit $status)."
      - name: Apply approved Issue 76 review fixes
        shell: bash
        run: |
          python <<'PY'
          import json
          import re
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              source = p.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              p.write_text(source.replace(old, new, 1))

          root = Path('package.json')
          pkg = json.loads(root.read_text())
          expected = 'node scripts/prepare-dsh-web.mjs && node scripts/prepare-pqg-application-shell.mjs && node scripts/apply-product-layer.mjs && node scripts/generate-dsh-api-routes.mjs'
          if pkg['scripts']['prepare:dsh-web'] != expected:
              raise SystemExit('package.json prepare:dsh-web drifted')
          pkg['scripts']['prepare:dsh-web'] = 'node scripts/prepare-dsh-web.mjs && node scripts/apply-product-layer.mjs && node scripts/generate-dsh-api-routes.mjs'
          deps = pkg['dependencies']
          next_deps = {}
          inserted = False
          for key, value in deps.items():
              if key == '@pqg/reference-module' and not inserted:
                  next_deps['@pqg/application-shell'] = 'file:packages/application-shell'
                  inserted = True
              next_deps[key] = value
          if not inserted:
              raise SystemExit('root dependency anchor @pqg/reference-module missing')
          pkg['dependencies'] = next_deps
          root.write_text(json.dumps(pkg, indent=2) + '\n')

          reference_pkg_path = Path('packages/reference-module/package.json')
          reference_pkg = json.loads(reference_pkg_path.read_text())
          reference_pkg['dependencies'] = {'@pqg/application-shell': 'file:../application-shell'}
          reference_pkg_path.write_text(json.dumps(reference_pkg, indent=2) + '\n')

          Path('packages/application-shell/src/contracts.ts').write_text("""export type SupportPanelState = 'collapsed' | 'compact' | 'expanded'

export interface ShellNavigationOwner {
  activeId: string
  navigate(targetId: string): void
}

export interface ShellWorkspaceOwner {
  activeId: string
}

export interface ShellSupportOwner {
  activeId: string
}

export interface ShellSearchProvider<TResult = unknown> {
  id: string
  label: string
  search(query: string): Promise<readonly TResult[]>
}

declare module '@deepseek-ai/dsh-client-ui-slots' {
  interface SlotMap {
    'pqg.shell.navigation': {
      kind: 'list'
      scope: 'root'
      owner: ShellNavigationOwner
    }
    'pqg.shell.workspace': {
      kind: 'chain'
      scope: 'root'
      owner: ShellWorkspaceOwner
    }
    'pqg.shell.home.widget': {
      kind: 'list'
      scope: 'root'
    }
    'pqg.shell.support.context': {
      kind: 'list'
      scope: 'root'
      owner: ShellSupportOwner
    }
    'pqg.shell.support.suggestion': {
      kind: 'list'
      scope: 'root'
      owner: ShellSupportOwner
    }
  }
}
""")

          replace_once(
              'packages/application-shell/src/client.tsx',
              "  | 'pqg.shell.home.widget'\n  | 'pqg.shell.search.provider'\n  | 'pqg.shell.support.context'",
              "  | 'pqg.shell.home.widget'\n  | 'pqg.shell.support.context'",
              'remove search rendered seat type',
          )
          replace_once(
              'packages/application-shell/src/client.tsx',
              "          React.createElement('div', { hidden: true, 'data-pqg-search-provider-seat': true },\n            renderSlot('pqg.shell.search.provider', { query: '' }, { fallback: null }),\n          ),\n          renderSlotChain('pqg.shell.workspace', { activeId }, { fallback: mainFallback }),",
              "          renderSlotChain('pqg.shell.workspace', { activeId }, { fallback: mainFallback }),",
              'remove hidden search renderer',
          )
          replace_once(
              'packages/application-shell/src/client.tsx',
              "      'pqg.shell.home.widget': { kind: 'list', scope: 'root' },\n      'pqg.shell.search.provider': { kind: 'list', scope: 'root' },\n      'pqg.shell.support.context': { kind: 'list', scope: 'root' },",
              "      'pqg.shell.home.widget': { kind: 'list', scope: 'root' },\n      'pqg.shell.support.context': { kind: 'list', scope: 'root' },",
              'remove search child declaration',
          )

          Path('packages/reference-module/src/client.tsx').write_text("""import type { ClientContext } from '@deepseek-ai/dsh-client-runtime/client'
import type { PropsRuntime } from '@deepseek-ai/dsh-client-ui-slots'
import type {} from '@pqg/application-shell/contracts'

type ReactApi = {
  createElement: (...args: any[]) => any
}

type ModuleState = {
  id: string
  enabled: boolean
}

const React = require('react') as ReactApi
const inject = ['slots']

async function referenceModuleEnabled(): Promise<boolean> {
  try {
    const response = await fetch('/api/pqg.modules', { headers: { accept: 'application/json' } })
    if (!response.ok) return false
    const body = await response.json() as { modules?: ModuleState[] }
    return Array.isArray(body.modules)
      && body.modules.some(module => module.id === 'reference' && module.enabled === true)
  } catch {
    return false
  }
}

function ReferenceNavigation({ activeId, navigate }: PropsRuntime<'pqg.shell.navigation'>) {
  return React.createElement(
    'button',
    {
      type: 'button',
      'data-pqg-reference-nav': true,
      'aria-current': activeId === 'reference' ? 'page' : undefined,
      onClick: () => navigate('reference'),
      style: {
        width: '100%',
        padding: '9px 12px',
        border: 0,
        borderRadius: 8,
        background: activeId === 'reference' ? 'var(--mantine-color-blue-light, #eef4ff)' : 'transparent',
        color: 'inherit',
        textAlign: 'left',
        cursor: 'pointer',
        font: 'inherit',
      },
    },
    'Mô-đun mẫu',
  )
}

function ReferenceWorkspace(_props: PropsRuntime<'pqg.shell.workspace'> & { matched: { moduleId: string } }) {
  return React.createElement(
    'section',
    { 'data-pqg-reference-workspace': true, style: { padding: 8 } },
    React.createElement('h1', { style: { margin: '0 0 8px', fontSize: 24 } }, 'Mô-đun mẫu'),
    React.createElement('p', { style: { margin: 0, color: 'var(--mantine-color-dimmed, #667085)' } }, 'Mô-đun mẫu đã kết nối qua PQG Shell.'),
  )
}

function ReferenceHomeWidget(_props: PropsRuntime<'pqg.shell.home.widget'>) {
  return React.createElement('div', { 'data-pqg-reference-home-widget': true }, 'Mô-đun mẫu đã sẵn sàng.')
}

function ReferenceSupportContext({ activeId }: PropsRuntime<'pqg.shell.support.context'>) {
  if (activeId !== 'reference') return null
  return React.createElement('p', { 'data-pqg-reference-support-context': true, style: { margin: 0, fontSize: 13 } }, 'Bạn đang ở Mô-đun mẫu.')
}

function ReferenceSupportSuggestion({ activeId }: PropsRuntime<'pqg.shell.support.suggestion'>) {
  if (activeId !== 'reference') return null
  return React.createElement('p', { 'data-pqg-reference-support-suggestion': true, style: { margin: 0, fontSize: 13 } }, 'Gợi ý theo ngữ cảnh sẽ xuất hiện tại đây.')
}

async function apply(ctx: ClientContext): Promise<void> {
  if (!(await referenceModuleEnabled())) return

  ctx.slots.inject('pqg.shell.navigation', () => ctx.slots.register({
    name: 'pqg.shell.navigation',
    id: 'reference',
    order: 0,
    label: 'Mô-đun mẫu',
  }, ReferenceNavigation))

  ctx.slots.inject('pqg.shell.workspace', () => ctx.slots.register({
    name: 'pqg.shell.workspace',
    select: ({ activeId }) => activeId === 'reference' ? { moduleId: 'reference' } : null,
  }, ReferenceWorkspace))

  ctx.slots.inject('pqg.shell.home.widget', () => ctx.slots.register({
    name: 'pqg.shell.home.widget',
    id: 'reference',
    order: 0,
    label: 'Mô-đun mẫu',
  }, ReferenceHomeWidget))

  ctx.slots.inject('pqg.shell.support.context', () => ctx.slots.register({
    name: 'pqg.shell.support.context',
    id: 'reference',
    order: 0,
    label: 'Mô-đun mẫu',
  }, ReferenceSupportContext))

  ctx.slots.inject('pqg.shell.support.suggestion', () => ctx.slots.register({
    name: 'pqg.shell.support.suggestion',
    id: 'reference',
    order: 0,
    label: 'Mô-đun mẫu',
  }, ReferenceSupportSuggestion))
}

module.exports = { inject, apply }
""")

          prepare_path = Path('scripts/prepare-dsh-web.mjs')
          prepare = prepare_path.read_text()
          pattern = re.compile(r"async function preparePqgApplicationShellClient\(\) \{.*?\n\}\n\nasync function preparePqgMantineSpikeClient", re.S)
          replacement = """async function preparePqgApplicationShellClient() {
  const entry = join(root, 'packages', 'application-shell', 'src', 'client.tsx')
  const result = await build({
    configFile: false,
    root,
    logLevel: 'silent',
    define: {
      'process.env.NODE_ENV': JSON.stringify('production'),
    },
    build: {
      write: false,
      target: 'es2022',
      minify: 'esbuild',
      cssCodeSplit: false,
      lib: {
        entry,
        formats: ['cjs'],
        fileName: 'client',
      },
      rollupOptions: {
        external: id => reactPlatformExternals.has(id),
        output: { inlineDynamicImports: true },
      },
    },
  })
  const runs = Array.isArray(result) ? result : [result]
  const outputs = runs.flatMap(run => Array.isArray(run?.output) ? run.output : [])
  const chunk = outputs.find(output => output.type === 'chunk' && output.isEntry)
  const css = outputs.find(output => output.type === 'asset' && output.fileName.endsWith('.css'))
  if (!chunk) throw new Error('PQG Application Shell bundle produced no entry chunk.')
  if (!css || typeof css.source !== 'string') throw new Error('PQG Application Shell bundle produced no CSS asset.')

  const bundled = [
    'window.__ModuleLoader__.load({ id: ' + JSON.stringify(pqgApplicationShellId) + ', factory: (require) => { var module = { exports: {} }; var exports = module.exports;',
    chunk.code.trimEnd(),
    'return module.exports; } });',
    '',
  ].join('\\n')
  const targetDir = join(publicDir, 'plugins', ...pqgApplicationShellId.split('/'))
  await mkdir(targetDir, { recursive: true })
  await writeFile(join(targetDir, 'client.js'), bundled)
  await writeFile(join(targetDir, 'styles.css'), css.source)
  return {
    entry: {
      id: pqgApplicationShellId,
      url: `/plugins/${pqgApplicationShellId}/client.js?rev=${hash(bundled)}`,
      rev: hash(bundled),
      inject: [
        '@deepseek-ai/dsh-client-runtime',
        '@deepseek-ai/dsh-client-ui-slots',
      ],
    },
    cssUrl: `/plugins/${pqgApplicationShellId}/styles.css?rev=${hash(css.source)}`,
  }
}

async function preparePqgMantineSpikeClient"""
          prepare, count = pattern.subn(replacement, prepare, count=1)
          if count != 1:
              raise SystemExit(f'prepare shell builder: expected one function, found {count}')
          old_entries = "  ...(await clientPackages()),\n  applicationShell,\n  referenceModule,"
          new_entries = "  ...(await clientPackages()),\n  applicationShell.entry,\n  referenceModule,"
          if prepare.count(old_entries) != 1:
              raise SystemExit('prepare shell entry shape drifted')
          prepare = prepare.replace(old_entries, new_entries, 1)
          old_html = 'const html = shellHtml.replace(headWithCharset, `${headWithCharset}\\n    <link rel="stylesheet" data-pqg-mantine-spike href="${mantineSpike.cssUrl}" />${makersBootstrap(graph)}`)'
          new_html = 'const html = shellHtml.replace(headWithCharset, `${headWithCharset}\\n    <link rel="stylesheet" data-pqg-mantine-spike href="${mantineSpike.cssUrl}" />\\n    <link rel="stylesheet" data-pqg-application-shell href="${applicationShell.cssUrl}" />${makersBootstrap(graph)}`)'
          if prepare.count(old_html) != 1:
              raise SystemExit('prepare shell CSS insertion point drifted')
          prepare = prepare.replace(old_html, new_html, 1)
          prepare_path.write_text(prepare)
          PY
          rm scripts/prepare-pqg-application-shell.mjs

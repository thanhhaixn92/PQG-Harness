name: issue-76-review-targeted

on:
  push:
    branches: [feature/76-application-shell]

permissions:
  contents: read

concurrency:
  group: issue-76-review-targeted
  cancel-in-progress: true

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/76-application-shell
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare DSH Web
        run: npm run prepare:dsh-web
      - name: Application Shell contract
        run: node --experimental-strip-types --test tests/application-shell-contract.test.ts

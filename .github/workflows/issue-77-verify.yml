name: issue-77-verify

on:
  push:
    branches:
      - feature/77-system-services
    paths:
      - .github/workflows/issue-77-verify.yml
      - .github/issue-77-run

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:dsh-web
      - name: Targeted system services RED/GREEN
        run: node --experimental-strip-types --test tests/system-services.test.ts tests/application-shell-contract.test.ts

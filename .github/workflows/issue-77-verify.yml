name: issue-77-verify

on:
  push:
    branches:
      - feature/77-system-services
    paths:
      - .github/workflows/issue-77-verify.yml
      - .github/issue-77-run

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:dsh-web
      - name: Grouped System Services + Shell contracts
        run: node --experimental-strip-types --test tests/system-services.test.ts tests/application-shell-contract.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build browser assets
        run: npm run build
      - name: Chromium system-services smoke
        shell: bash
        run: |
          set -euo pipefail
          npm exec vite -- preview --host 127.0.0.1 --port 4173 > /tmp/issue-77-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true; kill "${CHROME_PID:-}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=1440,1000 --remote-debugging-port=9222 --user-data-dir=/tmp/issue-77-chrome about:blank > /tmp/issue-77-chrome.log 2>&1 &
          CHROME_PID=$!

          node <<'NODE'
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms))
          for (let i = 0; i < 100; i++) {
            try {
              const response = await fetch('http://127.0.0.1:9222/json/version')
              if (response.ok) break
            } catch {}
            if (i === 99) throw new Error('Chrome DevTools endpoint did not become ready')
            await delay(100)
          }

          const created = await fetch('http://127.0.0.1:9222/json/new?about:blank', { method: 'PUT' })
          if (!created.ok) throw new Error(`Failed to create browser target: HTTP ${created.status}`)
          const target = await created.json()
          const ws = new WebSocket(target.webSocketDebuggerUrl)
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true })
            ws.addEventListener('error', reject, { once: true })
          })

          let sequence = 0
          const pending = new Map()
          const exceptions = []
          const errorLogs = []
          let loadedResolve
          const loaded = new Promise(resolve => { loadedResolve = resolve })
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = ++sequence
            pending.set(id, { resolve, reject })
            ws.send(JSON.stringify({ id, method, params }))
          })

          ws.addEventListener('message', event => {
            const message = JSON.parse(event.data)
            if (message.id && pending.has(message.id)) {
              const { resolve, reject } = pending.get(message.id)
              pending.delete(message.id)
              if (message.error) reject(new Error(JSON.stringify(message.error)))
              else resolve(message.result)
              return
            }
            if (message.method === 'Page.loadEventFired') loadedResolve()
            if (message.method === 'Runtime.exceptionThrown') {
              exceptions.push(message.params?.exceptionDetails?.exception?.description ?? message.params?.exceptionDetails?.text ?? JSON.stringify(message.params))
            }
            if (message.method === 'Log.entryAdded' && message.params?.entry?.level === 'error') {
              errorLogs.push(message.params.entry.text)
            }
            if (message.method === 'Runtime.consoleAPICalled' && message.params?.type === 'error') {
              errorLogs.push((message.params.args ?? []).map(arg => arg.value ?? arg.description ?? '').join(' '))
            }
            if (message.method === 'Fetch.requestPaused') {
              const requestId = message.params.requestId
              const url = message.params.request?.url ?? ''
              if (url.includes('/api/pqg.modules')) {
                const body = Buffer.from(JSON.stringify({ modules: [{ id: 'reference', label: 'Reference Module', enabled: true }] })).toString('base64')
                void send('Fetch.fulfillRequest', {
                  requestId,
                  responseCode: 200,
                  responseHeaders: [{ name: 'content-type', value: 'application/json' }],
                  body,
                })
              } else {
                void send('Fetch.continueRequest', { requestId })
              }
            }
          })

          await send('Runtime.enable')
          await send('Log.enable')
          await send('Page.enable')
          await send('Fetch.enable', { patterns: [{ urlPattern: '*pqg.modules*' }] })
          await send('Emulation.setDeviceMetricsOverride', { width: 1440, height: 1000, deviceScaleFactor: 1, mobile: false })
          await send('Page.navigate', { url: 'http://127.0.0.1:4173/' })
          await Promise.race([loaded, delay(15000).then(() => { throw new Error('Page load timed out') })])

          const evaluate = async expression => {
            const result = await send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true })
            if (result?.exceptionDetails) throw new Error(result.exceptionDetails.text ?? 'Runtime.evaluate failed')
            return result?.result?.value
          }
          const waitFor = async (expression, label) => {
            for (let i = 0; i < 120; i++) {
              if (await evaluate(expression)) return
              await delay(100)
            }
            throw new Error(`Timed out waiting for ${label}`)
          }

          await waitFor('document.querySelector("#pqg-application-shell") !== null', 'PQG shell')
          await waitFor('document.querySelector("[data-pqg-reference-nav]") !== null', 'enabled reference module')

          await evaluate('document.querySelector("[data-pqg-reference-nav]").click(); true')
          await waitFor('document.querySelector("#pqg-application-shell")?.getAttribute("data-pqg-active") === "reference"', 'reference navigation')
          await waitFor('document.querySelector("[data-pqg-reference-workspace]") !== null', 'reference workspace')
          await waitFor('document.querySelector("[data-pqg-support-context=reference]") !== null', 'structured support context')
          await waitFor('document.querySelectorAll("[data-pqg-support-suggestion]").length === 2', 'contextual support suggestions')

          await evaluate('document.querySelector("[data-pqg-search-toggle]").click(); true')
          await waitFor('document.querySelector("[data-pqg-search-input]") !== null && document.querySelector("[data-pqg-search-input]").offsetParent !== null', 'Spotlight search')
          await evaluate(`(() => { const input = document.querySelector('[data-pqg-search-input]'); input.focus(); const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set; setter.call(input, 'reference'); input.dispatchEvent(new Event('input', { bubbles: true })); return true })()`)
          await waitFor('document.querySelector("[data-pqg-search-result=\"reference:open-reference\"]") !== null', 'aggregated search result')

          await evaluate(`(() => { const input = document.querySelector('[data-pqg-search-input]'); input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); return true })()`)
          await evaluate(`window.dispatchEvent(new KeyboardEvent('keydown', { key: 'k', ctrlKey: true, bubbles: true, cancelable: true })); true`)
          await waitFor('document.querySelector("[data-pqg-search-input]") !== null && document.querySelector("[data-pqg-search-input]").offsetParent !== null', 'Ctrl+K Spotlight')

          const fatalLogs = errorLogs.filter(text => /root.*no registration|no registration.*root|slot.*collision|collision.*slot|layout: panel actions not wired|activation.*(?:fail|error)|activate.*(?:fail|error)|web boot: .*did not activate|ReferenceError|TypeError/i.test(text))
          console.log(JSON.stringify({
            shell: true,
            searchProvider: true,
            ctrlK: true,
            supportContext: true,
            supportSuggestions: 2,
            exceptions,
            fatalLogs,
            errorLogs,
          }, null, 2))
          ws.close()
          if (exceptions.length > 0) throw new Error(`Browser exceptions detected: ${exceptions.join(' | ')}`)
          if (fatalLogs.length > 0) throw new Error(`Browser fatal logs detected: ${fatalLogs.join(' | ')}`)
          NODE
      - name: Exact Makers build
        run: npm run build:makers

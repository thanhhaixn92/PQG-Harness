name: Task module cleanup

on:
  push:
    branches:
      - feature/78-task-module

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/78-task-module
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Keep Reference producer unchanged and isolate Task bundling
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const path = 'scripts/prepare-dsh-web.mjs'
          let source = readFileSync(path, 'utf8')
          const start = source.indexOf('async function preparePqgModuleClient(id, entry, inject) {')
          const end = source.indexOf('async function preparePqgApplicationShellClient()', start)
          if (start < 0 || end <= start) throw new Error('Could not locate generic PQG module producer block')

          const replacement = `async function preparePqgReferenceModuleClient() {
            const entry = join(root, 'packages', 'reference-module', 'src', 'client.tsx')
            const source = await readFile(entry, 'utf8')
            const transformed = await transformWithEsbuild(source, entry, {
              loader: 'tsx',
              target: 'es2022',
              format: 'cjs',
              sourcemap: false,
              charset: 'utf8',
            })
            const bundled = [
              \`window.__ModuleLoader__.load({ id: \${JSON.stringify(pqgReferenceModuleId)}, factory: (require) => { var module = { exports: {} }; var exports = module.exports;\`,
              transformed.code.trimEnd(),
              'return module.exports; } });',
              '',
            ].join('\\n')
            const target = join(publicDir, 'plugins', ...pqgReferenceModuleId.split('/'), 'client.js')
            await mkdir(dirname(target), { recursive: true })
            await writeFile(target, bundled)
            const rev = hash(bundled)
            return {
              id: pqgReferenceModuleId,
              url: \`/plugins/\${pqgReferenceModuleId}/client.js?rev=\${rev}\`,
              rev,
              inject: [
                '@deepseek-ai/dsh-client-runtime',
                '@deepseek-ai/dsh-client-ui-slots',
              ],
            }
          }

          async function preparePqgTaskModuleClient() {
            const id = pqgTaskModuleId
            const entry = join(root, 'packages', 'task-module', 'src', 'client.tsx')
            const result = await build({
              configFile: false,
              root,
              logLevel: 'silent',
              define: {
                'process.env.NODE_ENV': JSON.stringify('production'),
              },
              build: {
                write: false,
                target: 'es2022',
                minify: 'esbuild',
                cssCodeSplit: false,
                lib: {
                  entry,
                  formats: ['cjs'],
                  fileName: 'client',
                },
                rollupOptions: {
                  external: moduleId => reactPlatformExternals.has(moduleId),
                  output: { inlineDynamicImports: true },
                },
              },
            })
            const runs = Array.isArray(result) ? result : [result]
            const outputs = runs.flatMap(run => Array.isArray(run?.output) ? run.output : [])
            const chunk = outputs.find(output => output.type === 'chunk' && output.isEntry)
            if (!chunk) throw new Error(\`PQG module \${id} bundle produced no entry chunk.\`)

            const bundled = [
              'window.__ModuleLoader__.load({ id: ' + JSON.stringify(id) + ', factory: (require) => { var module = { exports: {} }; var exports = module.exports;',
              chunk.code.trimEnd(),
              'return module.exports; } });',
              '',
            ].join('\\n')
            const target = join(publicDir, 'plugins', ...id.split('/'), 'client.js')
            await mkdir(dirname(target), { recursive: true })
            await writeFile(target, bundled)
            const rev = hash(bundled)
            return {
              id,
              url: \`/plugins/\${id}/client.js?rev=\${rev}\`,
              rev,
              inject: [
                '@deepseek-ai/dsh-client-runtime',
                '@deepseek-ai/dsh-client-ui-slots',
                '@pqg/application-shell',
              ],
            }
          }

          `
          source = source.slice(0, start) + replacement + source.slice(end)
          if (source.includes('async function preparePqgModuleClient(id, entry, inject)')) {
            throw new Error('Generic producer still present')
          }
          writeFileSync(path, source)
          NODE

      - name: Install exact dependencies
        run: npm ci

      - name: Regenerate DSH Web assets
        run: npm run prepare:dsh-web

      - name: Targeted Task verification
        run: node --experimental-strip-types --test tests/task-module.test.ts tests/module-contract.test.ts tests/mcp-permission.test.ts tests/mcp-bridge.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task-module-cleanup.yml
          git add scripts/prepare-dsh-web.mjs index.html public
          git commit -m "refactor(task): isolate Task client bundling"
          git push origin HEAD:feature/78-task-module

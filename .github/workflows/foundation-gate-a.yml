name: foundation-gate-a

on:
  push:
    branches: [fix/48-foundation-recovery]

permissions:
  contents: read

jobs:
  gate-a:
    if: "${{ github.event.head_commit.message == 'ci: run Foundation Gate A' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Targeted Foundation tests
        run: >-
          node --experimental-strip-types --test
          tests/workspace.test.ts
          tests/sidecar-lifecycle.test.ts
          tests/sidecar-settings.test.ts
          tests/proxy-error-policy.test.ts
          tests/proxy-stream.test.ts
          tests/gateway-proxy.test.ts
          tests/mcp-bridge.test.ts
          tests/module-policy.test.ts
          tests/module-state.test.ts
          tests/m08-native-cancellation.test.ts
          tests/dsh-web.test.ts
      - name: Typecheck once
        run: npm run typecheck
      - name: Exact Makers build once
        run: npm run build:makers
      - name: Verify prepared output is deterministic
        run: git diff --exit-code -- index.html public agents/api
      - name: Record candidate build identity
        run: cat dist/build-meta.json

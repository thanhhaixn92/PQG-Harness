name: normalize-transitive-lock

on:
  push:
    branches:
      - impl/foundation-transitive-security-refresh

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild lock from integration baseline with only reviewed package entries
        shell: bash
        run: |
          cp package-lock.json /tmp/current-lock.json
          git show 0a6b68320e6a53378c0046d2a8aebdac2f345c21:package-lock.json > /tmp/base-lock.json
          node <<'NODE'
          const fs = require('fs')
          const assert = require('assert/strict')
          const base = JSON.parse(fs.readFileSync('/tmp/base-lock.json', 'utf8'))
          const current = JSON.parse(fs.readFileSync('/tmp/current-lock.json', 'utf8'))
          const targets = ['node_modules/fast-uri', 'node_modules/qs']
          for (const key of targets) {
            if (!current.packages?.[key]) throw new Error(`missing current lock entry: ${key}`)
            base.packages[key] = current.packages[key]
          }
          fs.writeFileSync('package-lock.json', `${JSON.stringify(base, null, 2)}\n`)

          const candidate = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const original = JSON.parse(fs.readFileSync('/tmp/base-lock.json', 'utf8'))
          for (const key of targets) candidate.packages[key] = original.packages[key]
          assert.deepStrictEqual(candidate, original, 'lock refresh changed data outside fast-uri/qs entries')
          NODE
      - name: Verify exact reviewed versions
        shell: bash
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json')
          if (lock.packages['node_modules/fast-uri']?.version !== '3.1.7') throw new Error('fast-uri is not 3.1.7')
          if (lock.packages['node_modules/qs']?.version !== '6.16.0') throw new Error('qs is not 6.16.0')
          NODE
      - name: Commit normalized lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix: constrain transitive lock refresh to reviewed entries'
          git push origin HEAD:impl/foundation-transitive-security-refresh

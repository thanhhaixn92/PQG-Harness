name: task-runtime-activation-green

on:
  push:
    branches:
      - fix/task-runtime-activation

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run prepare:dsh-web
      - run: node --experimental-strip-types --test tests/task-module.test.ts
      - name: Commit generated assets and remove temporary workflow
        run: |
          rm .github/workflows/task-runtime-activation-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh task runtime generated assets"
          git push

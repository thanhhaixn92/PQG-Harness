<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PQG Foundation Diagnostics</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;padding:24px;background:Canvas;color:CanvasText}main{max-width:860px;margin:auto}button{font:inherit;padding:10px 14px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;border:1px solid color-mix(in srgb,CanvasText 20%,transparent);border-radius:10px}small{opacity:.72}
  </style>
</head>
<body>
<main>
  <h1>PQG Foundation Diagnostics</h1>
  <p>Kiểm tra cùng một EdgeOne Makers conversation context cho module, session và workspace.</p>
  <button id="run" type="button">Chạy kiểm tra</button>
  <p><small>Không đọc cookie, access secret hoặc token.</small></p>
  <pre id="output">Chưa chạy.</pre>
</main>
<script>
(() => {
  const button = document.getElementById('run');
  const output = document.getElementById('output');
  const probes = [
    { path: '/api/pqg.modules', method: 'GET' },
    { path: '/api/session.list', method: 'POST', rpcMethod: 'session.list' },
    { path: '/api/workspace.list', method: 'POST', rpcMethod: 'workspace.list' },
  ];

  function safeErrorBody(text) {
    return text.slice(0, 1200);
  }

  async function probe(spec, conversationId) {
    const headers = { 'Makers-Conversation-Id': conversationId };
    const options = {
      method: spec.method,
      headers,
      credentials: 'same-origin',
    };
    if (spec.rpcMethod) {
      headers['content-type'] = 'application/json';
      const rpcRequest = {
        type: 'client-request',
        rpcId: crypto.randomUUID(),
        method: spec.rpcMethod,
        payload: {},
      };
      options.body = JSON.stringify(rpcRequest);
    }

    const response = await fetch(spec.path, options);
    const text = await response.text();
    if (!response.ok) {
      return `${spec.path}\nHTTP ${response.status}\n${safeErrorBody(text)}`;
    }
    if (spec.path === '/api/pqg.modules') {
      try {
        const parsed = JSON.parse(text);
        const modules = Array.isArray(parsed?.modules)
          ? parsed.modules.map((item) => ({ id: item?.id, enabled: item?.enabled }))
          : [];
        return `${spec.path}\nHTTP ${response.status}\n${JSON.stringify({ modules }, null, 2)}`;
      } catch {
        return `${spec.path}\nHTTP ${response.status}\nOK (${text.length} bytes)`;
      }
    }
    try {
      const parsed = JSON.parse(text);
      if (parsed?.result?.ok === true) {
        return `${spec.path}\nHTTP ${response.status}\nRPC OK`;
      }
      if (parsed?.result?.ok === false) {
        const error = parsed.result.error || {};
        return `${spec.path}\nHTTP ${response.status}\nRPC ERROR\n${safeErrorBody(JSON.stringify({ code: error.code, message: error.message }, null, 2))}`;
      }
    } catch {
      // Fall through to the bounded response summary.
    }
    return `${spec.path}\nHTTP ${response.status}\nOK (${text.length} bytes)`;
  }

  button.addEventListener('click', async () => {
    button.disabled = true;
    output.textContent = 'Đang chạy…';
    const conversationId = `audit-${crypto.randomUUID().replaceAll('-', '').slice(0, 24)}`;
    const rows = [`conversation_id: ${conversationId}`];
    for (const spec of probes) {
      try {
        rows.push(await probe(spec, conversationId));
      } catch (error) {
        rows.push(`${spec.path}\nFETCH ERROR\n${String(error).slice(0, 1200)}`);
      }
    }
    output.textContent = rows.join('\n\n----------------\n\n');
    button.disabled = false;
  });
})();
</script>
</body>
</html>
